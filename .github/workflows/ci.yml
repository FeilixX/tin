name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The packaging test runs each shipped hook command through this host's
      # own shell. The shells disagree about what a command line means, so the
      # test only proves anything when every supported platform runs it.
      - name: Test
        run: cargo test --workspace

      - name: Package
        run: cargo xtask package
